# CPU-based autoscaling. k3s includes metrics-server, so no extra install is
# needed. The local cluster is single-node, so scaling is bounded by the
# resources of one laptop (a stated limitation in the report).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: command-parser
  namespace: app
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: command-parser
  minReplicas: 1
  maxReplicas: 2
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Pods
          value: 1
          periodSeconds: 30
    scaleDown:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 1
          periodSeconds: 30
