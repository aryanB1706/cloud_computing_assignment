# Inference Deployment (namespace app): two replicas, resource bounds, probes.
# MODEL_VERSION and MODEL_URI are changed to v2 for the rolling-update exercise.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: command-parser
  namespace: app
  labels:
    app: command-parser
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: command-parser
  template:
    metadata:
      labels:
        app: command-parser
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: service
          image: command-parser-service:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: MODEL_URI
              value: s3://models/v1/model.tar.gz
            - name: MODEL_VERSION
              value: v1
            - name: S3_ENDPOINT
              value: http://seaweedfs-s3.data.svc.cluster.local:8333
            - name: MAX_NEW_TOKENS
              value: "128"
            - name: FAULT_INJECT
              value: "0"
            - name: MODEL_CACHE_DIR
              value: /tmp/model
            - name: HF_HOME
              value: /tmp/hf
            - name: HOME
              value: /tmp
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: model-store-credentials
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: model-store-credentials
                  key: AWS_SECRET_ACCESS_KEY
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: command-parser
  namespace: app
  labels:
    app: command-parser
spec:
  type: ClusterIP
  selector:
    app: command-parser
  ports:
    - name: http
      port: 80
      targetPort: http
